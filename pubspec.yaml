name: question_reminder_app
description: 个人问题记录与提醒应用

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 语音识别
  speech_to_text: ^7.0.0
  
  # 本地数据库
  sqflite: ^2.4.0
  path: ^1.9.0
  
  # 本地通知
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  
  # 状态管理
  flutter_riverpod: ^2.6.1
  
  # UI组件
  table_calendar: ^3.1.0
  flutter_slidable: ^4.0.0
  
  # 工具
  intl: ^0.20.0
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
